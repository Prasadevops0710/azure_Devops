trigger:
  branches:
    include:
      - main

pr: none

variables:
  # Create this Azure DevOps service connection against the target ACR.
  dockerRegistryServiceConnection: 'bytebrief-acr-service-connection'
  imageRepository: 'bytebrief'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  containerRegistry: 'bytebrief.azurecr.io'
  buildTag: 'build-$(Build.BuildId)'
  commitTag: 'sha-$(Build.SourceVersion)'

pool:
  vmImage: ubuntu-latest

stages:
  - stage: BuildAndPush
    displayName: Build and push image
    jobs:
      - job: Docker
        displayName: Build Bytebrief image
        steps:
          - checkout: self
            displayName: Checkout source

          - task: Docker@2
            displayName: Build and push to Azure Container Registry
            inputs:
              command: buildAndPush
              containerRegistry: '$(dockerRegistryServiceConnection)'
              repository: '$(imageRepository)'
              dockerfile: '$(dockerfilePath)'
              buildContext: '$(Build.SourcesDirectory)'
              tags: |
                $(buildTag)
                $(commitTag)
              arguments: >-
                --label org.opencontainers.image.source=$(Build.Repository.Uri)
                --label org.opencontainers.image.revision=$(Build.SourceVersion)

          - bash: |
              echo "Published $(containerRegistry)/$(imageRepository):$(buildTag)"
              echo "Published $(containerRegistry)/$(imageRepository):$(commitTag)"
            displayName: Report published image